<ion-header class="settings-header">
  <app-header class="header" title="Réglages"></app-header>
</ion-header>

<ion-content [fullscreen]="true" class="settings-content">
  <div class="settings-body">

    <section class="settings-section">
      <h2 class="settings-section-title">Apparence</h2>
      <div class="settings-card">
        <span class="settings-row-label">Thème</span>
        <div class="settings-themes">
          @for (theme of themes; track theme) {
            <button
              class="settings-theme"
              [class.settings-theme-active]="theme === currentTheme"
              type="button"
              (click)="selectTheme(theme)">
              {{ theme }}
            </button>
          }
        </div>
      </div>
    </section>

    <section class="settings-section">
      <h2 class="settings-section-title">Notifications</h2>
      <button class="settings-card settings-row" type="button" (click)="toggleNotifications()">
        <span class="settings-row-label">Rappels activés</span>
        <span class="settings-switch" [class.settings-switch-on]="notificationsEnabled && systemAllowed">
          <span class="settings-switch-knob"></span>
        </span>
      </button>

      @if (loaded && notificationsSupported && !permissionGranted) {
        <div class="settings-warning">
          <span class="settings-warning-text">Les notifications sont bloquées au niveau du système.</span>
          <button class="settings-warning-btn" type="button" (click)="openNotificationSettings()">Ouvrir les réglages</button>
        </div>
      }
    </section>

    <section class="settings-section">
      <h2 class="settings-section-title">À propos</h2>
      <div class="settings-card settings-row">
        <span class="settings-row-label">Version</span>
        <span class="settings-row-value">{{ version }}</span>
      </div>
      <button class="settings-card settings-row" type="button" (click)="goToVersions()">
        <span class="settings-row-label">Notes de version</span>
        <ion-icon class="settings-row-chevron" name="chevron-forward"></ion-icon>
      </button>
    </section>

  </div>
</ion-content>

<app-navbar class="settings-navbar"></app-navbar>
