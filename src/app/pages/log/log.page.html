<ion-header class="log-header">
  <app-header class="header" title="Nouveau log"></app-header>
</ion-header>

<ion-content [fullscreen]="true" class="log-content">
  @if (!loaded) {
  } @else if (habits.length === 0) {
    <app-empty-state
      class="log-empty"
      title="Aucune habitude"
      message="Crée d'abord une habitude pour pouvoir la suivre."
      actionLabel="Aller aux habitudes"
      (action)="goToHabits()">
    </app-empty-state>
  } @else {
    <div class="log-form">
      <label class="log-label">Habitude</label>
      <app-habit-dropdown
        class="log-dropdown"
        [habits]="habits"
        [selectedId]="currentId"
        (pick)="onPickHabit($event)">
      </app-habit-dropdown>

      <label class="log-label">Commentaire (optionnel)</label>
      <textarea class="log-textarea" [(ngModel)]="comment" rows="3" placeholder="Une note…"></textarea>

      <button class="log-submit" type="button" (click)="submit()">Enregistrer le log</button>
      <button class="log-late" type="button" (click)="openLate()">Saisir un log passé</button>
    </div>
  }
</ion-content>

@if (toastOpen) {
  <div class="app-toast">{{ toastMessage }}</div>
}

<app-navbar class="log-navbar"></app-navbar>

<app-modal [open]="lateModal.open" title="Saisir un log passé" (dismiss)="closeLate()">
  <div class="log-late-form">
    <label class="log-label">Habitude</label>
    <app-habit-dropdown
      #lateDropdown
      class="log-dropdown"
      [habits]="habits"
      [selectedId]="lateModal.habitId"
      (pick)="onPickLateHabit($event)">
    </app-habit-dropdown>

    <label class="log-label">Date et heure</label>
    <input class="log-input" type="datetime-local" [(ngModel)]="lateModal.occurredAt" />

    <label class="log-label">Commentaire (optionnel)</label>
    <textarea class="log-textarea" [(ngModel)]="lateModal.comment" rows="3" placeholder="Une note…"></textarea>
  </div>

  <div class="log-late-actions" modalFooter>
    <button class="modal-btn" type="button" (click)="closeLate()">Annuler</button>
    <button class="modal-btn modal-btn-primary" type="button" (click)="submitLate()">Enregistrer</button>
  </div>
</app-modal>
