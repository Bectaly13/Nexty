<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- chevron gauche : bleu accent -->
    <linearGradient id="chevMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <!-- chevron droit : bleu clair (effet de vitesse / mouvement) -->
    <linearGradient id="chevLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <!-- halo lumineux -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <!-- ombre portée douce de la tuile -->
    <filter id="tileShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <!-- confine le glow à l'intérieur de la tuile -->
    <clipPath id="tileClip">
      <rect x="24" y="24" width="152" height="152" rx="44"/>
    </clipPath>
  </defs>

  <!-- tuile blanche à coins arrondis -->
  <rect x="24" y="24" width="152" height="152" rx="44" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#tileShadow)"/>

  <g clip-path="url(#tileClip)">
    <!-- calque glow (flou) SOUS les chevrons nets → forme nette + halo.
         Décalage de +5px vers la droite : centrage OPTIQUE (la masse des chevrons penche à gauche). -->
    <g fill="none" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.55">
      <path d="M63 62 L99 100 L63 138" stroke="#3B82F6"/>
      <path d="M111 62 L147 100 L111 138" stroke="#60A5FA"/>
    </g>
    <!-- double chevron « next » : le droit plus clair pour l'effet de vitesse -->
    <g fill="none" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <path d="M63 62 L99 100 L63 138" stroke="url(#chevMain)"/>
      <path d="M111 62 L147 100 L111 138" stroke="url(#chevLight)"/>
    </g>
  </g>
</svg>
